<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-labelledby="title desc">
  <title id="title">pastepack pack and unpack flow</title>
  <desc id="desc">Pack: any bytes, optional zlib, AES-256-GCM encryption, Base91 encoding, framed text. Unpack: pasted text, Base91 decoding, AES-256-GCM decryption, optional zlib, the same bytes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#64748b"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .row { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #94a3b8; }
      .name { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .note { font-size: 12px; fill: #94a3b8; }
      .box { fill: #0f172a; stroke-width: 1.5; }
      .io { stroke: #475569; }
      .step { stroke: #22d3ee; stroke-opacity: 0.55; }
      .wire { stroke: #34d399; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="880" height="290" rx="20" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="878.5" height="288.5" rx="19.25" fill="none" stroke="#334155" stroke-width="1.5"/>


  <text class="sans row" x="40" y="46">PACK</text>
  <rect class="box io" x="40" y="62" width="128" height="56" rx="10"/>
  <text class="mono name" x="104" y="87" text-anchor="middle">any bytes</text>
  <text class="sans note" x="104" y="105" text-anchor="middle">file or stdin</text>
  <path class="arrow" d="M173 90 H203"/>
  <rect class="box step" x="208" y="62" width="128" height="56" rx="10"/>
  <text class="mono name" x="272" y="87" text-anchor="middle">zlib</text>
  <text class="sans note" x="272" y="105" text-anchor="middle">only if smaller</text>
  <path class="arrow" d="M341 90 H371"/>
  <rect class="box step" x="376" y="62" width="128" height="56" rx="10"/>
  <text class="mono name" x="440" y="87" text-anchor="middle">AES-256-GCM</text>
  <text class="sans note" x="440" y="105" text-anchor="middle">encrypt</text>
  <path class="arrow" d="M509 90 H539"/>
  <rect class="box step" x="544" y="62" width="128" height="56" rx="10"/>
  <text class="mono name" x="608" y="87" text-anchor="middle">Base91</text>
  <text class="sans note" x="608" y="105" text-anchor="middle">encode</text>
  <path class="arrow" d="M677 90 H707"/>
  <rect class="box wire" x="712" y="62" width="128" height="56" rx="10"/>
  <text class="mono name" x="776" y="87" text-anchor="middle" style="fill: url(#accent)">-pack-…-end-</text>
  <text class="sans note" x="776" y="105" text-anchor="middle">framed text</text>

  <text class="sans row" x="40" y="174">UNPACK</text>
  <rect class="box wire" x="40" y="190" width="128" height="56" rx="10"/>
  <text class="mono name" x="104" y="215" text-anchor="middle">pasted text</text>
  <text class="sans note" x="104" y="233" text-anchor="middle">noise is fine</text>
  <path class="arrow" d="M173 218 H203"/>
  <rect class="box step" x="208" y="190" width="128" height="56" rx="10"/>
  <text class="mono name" x="272" y="215" text-anchor="middle">Base91</text>
  <text class="sans note" x="272" y="233" text-anchor="middle">decode</text>
  <path class="arrow" d="M341 218 H371"/>
  <rect class="box step" x="376" y="190" width="128" height="56" rx="10"/>
  <text class="mono name" x="440" y="215" text-anchor="middle">AES-256-GCM</text>
  <text class="sans note" x="440" y="233" text-anchor="middle">decrypt + verify</text>
  <path class="arrow" d="M509 218 H539"/>
  <rect class="box step" x="544" y="190" width="128" height="56" rx="10"/>
  <text class="mono name" x="608" y="215" text-anchor="middle">zlib</text>
  <text class="sans note" x="608" y="233" text-anchor="middle">if flagged</text>
  <path class="arrow" d="M677 218 H707"/>
  <rect class="box io" x="712" y="190" width="128" height="56" rx="10"/>
  <text class="mono name" x="776" y="215" text-anchor="middle">same bytes</text>
  <text class="sans note" x="776" y="233" text-anchor="middle">stdout or file</text>
</svg>
