[project]
name = "pastepack"
version = "0.1.0"
description = "Pack any file or stream into text that survives copy/paste, and unpack it again"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "base91>=1.0.1",
    "click>=8.4.1",
    "cryptography>=48.0.0",
    "rich-click>=1.9.8",
]

[project.scripts]
pastepack = "pastepack.cli:main"
pp = "pastepack.cli:pp"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pastepack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
